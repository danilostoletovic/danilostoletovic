name: IndexNow after production deployment

on:
  workflow_run:
    workflows: [Site and agent contracts]
    types: [completed]
    branches: [main]
  deployment_status:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      startsWith(github.ref, 'refs/heads/') &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))) &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.production_environment == true &&
        github.event.deployment.environment == 'Production' &&
        (github.event.deployment.ref == github.event.repository.default_branch ||
         github.event.deployment.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Reconcile the live production manifest
        env:
          GH_TOKEN: ${{ github.token }}
          INDEXNOW_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_DEPLOY_SHA: ${{ github.event.deployment.sha || github.event.workflow_run.head_sha || '' }}
        run: node scripts/indexnow.mjs
