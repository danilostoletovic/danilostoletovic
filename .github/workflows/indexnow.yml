name: IndexNow after production deployment

on:
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      startsWith(github.ref, 'refs/heads/') &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.production_environment == true &&
        github.event.deployment.environment == 'Production' &&
        (github.event.deployment.ref == github.event.repository.default_branch ||
         github.event.deployment.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Reconcile the live production manifest
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_DEPLOY_SHA: ${{ github.event.deployment.sha || (github.event_name == 'push' && github.sha) || '' }}
        run: node scripts/indexnow.mjs
